
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YOUR SHOW - ISLAMPUR CABLE</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

#twitch-player {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 1;
}

#play-button {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 5;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 3px solid white;
    background: rgba(220, 0, 0, 0.90);
    color: white;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}

#play-button:focus {
    outline: 6px solid yellow;
    outline-offset: 5px;
    background: #ff6600;
    transform: translate(-50%, -50%) scale(1.12);
}

.watermark {
    position: fixed;
    right: 15px;
    bottom: 15px;
    z-index: 10;
    padding: 8px 12px;
    background: rgba(0, 0, 0, 0.80);
    color: white;
    border-radius: 6px;
    text-align: right;
    pointer-events: none;
    text-shadow: 1px 1px 3px black;
}

.watermark strong {
    display: block;
    font-size: 18px;
    letter-spacing: 1px;
}

.watermark span {
    display: block;
    margin-top: 4px;
    font-size: 13px;
}

</style>
</head>

<body>

<iframe
    id="twitch-player"
    src="https://player.twitch.tv/?channel=sanjit875&parent=sanjit8759.github.io&autoplay=true"
    allow="autoplay; fullscreen"
    allowfullscreen
    tabindex="0">
</iframe>

<button id="play-button" type="button" autofocus>
    ▶ PLAY
</button>

<div class="watermark">
    <strong>ISLAMPUR CABLE</strong>
    <span>ইন্টারনেট সংযোগের জন্য যোগাযোগ করুন: 8759411065</span>
</div>

<script>
const playButton = document.getElementById("play-button");
const twitchPlayer = document.getElementById("twitch-player");

playButton.addEventListener("click", function () {
    twitchPlayer.focus();
    playButton.style.display = "none";
});

document.addEventListener("keydown", function(event) {

    if (
        event.key === "Enter" ||
        event.key === " " ||
        event.key === "OK" ||
        event.keyCode === 23 ||
        event.keyCode === 66
    ) {
        if (document.activeElement === playButton) {
            event.preventDefault();
            twitchPlayer.focus();
            playButton.style.display = "none";
        }
    }

});

window.onload = function() {
    playButton.focus();
};
</script>

</body>
</html>

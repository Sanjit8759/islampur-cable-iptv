
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUR SHOW - ISLAMPUR CABLE</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

#playerBox {
    position: fixed;
    inset: 0;
    background: #000;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

.watermark {
    position: absolute;
    left: 18px;
    bottom: 55px;
    color: white;
    font-family: Arial, sans-serif;
    text-shadow: 2px 2px 5px #000;
    pointer-events: none;
    z-index: 5;
}

.watermark .brand {
    font-size: 22px;
    font-weight: bold;
}

.watermark .contact {
    font-size: 14px;
    margin-top: 5px;
}

#status {
    position: absolute;
    top: 15px;
    left: 15px;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 8px 12px;
    font: 14px Arial, sans-serif;
    z-index: 6;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="playerBox">

    <video
        id="liveVideo"
        controls
        autoplay
        muted
        playsinline
        preload="auto">
    </video>

    <div class="watermark">
        <div class="brand">ISLAMPUR CABLE</div>
        <div class="contact">
            ইন্টারনেট সংযোগের জন্য যোগাযোগ করুন: 8759411065
        </div>
    </div>

    <div id="status">লাইভ ভিডিও লোড হচ্ছে...</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
const video = document.getElementById("liveVideo");
const statusText = document.getElementById("status");

const streamURL =
    "http://115.187.41.216:8080/hls/samtvislampur/index.m3u8";

function showStatus(message) {
    statusText.textContent = message;
    statusText.style.display = "block";
}

function hideStatus() {
    statusText.style.display = "none";
}

if (video.canPlayType("application/vnd.apple.mpegurl")) {

    video.src = streamURL;

} else if (window.Hls && Hls.isSupported()) {

    const hls = new Hls({
        liveSyncDurationCount: 3,
        enableWorker: true
    });

    hls.loadSource(streamURL);
    hls.attachMedia(video);

    hls.on(Hls.Events.MANIFEST_PARSED, function() {
        video.play().catch(() => {
            showStatus("PLAY বোতাম চাপুন");
        });
    });

    hls.on(Hls.Events.ERROR, function(event, data) {
        if (data.fatal) {
            showStatus("লাইভ স্ট্রিম চালানো যাচ্ছে না");
        }
    });

} else {

    showStatus("এই ডিভাইসে HLS সাপোর্ট নেই");
}

video.addEventListener("playing", hideStatus);

video.addEventListener("waiting", function() {
    showStatus("ভিডিও লোড হচ্ছে...");
});

video.addEventListener("error", function() {
    showStatus("ভিডিও চালাতে সমস্যা হচ্ছে");
});

video.addEventListener("canplay", function() {
    video.play().catch(() => {
        showStatus("PLAY বোতাম চাপুন");
    });
});
</script>

</body>
</html>
